set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-option -g status-position top
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g status-style "bg=terminal,fg=white"
set -g status-interval 1
set -g status-left-length 200
set -g status-left-length 200
set -g status-left "#[fg=cyan,bold] 󰣇 #[fg=green,bold] 󱂬 #S #[fg=yellow,bold] 󰉋 #W"
set -g status-justify "absolute-centre"

# Fix the window status formats
set -g window-status-current-format "#[fg=green]#[bg=green,fg=black]#(bash ~/lq/iconify.bash #W)#W#[bg=black,fg=green]"
set -g window-status-format "#[fg=black]#[bg=black,fg=green]#(bash ~/lq/iconify.bash #W)#W#[bg=default,fg=black]"
set -g pane-active-border-style "fg=white"
set -g pane-border-style "fg=white"
set -g message-style "bg=black,fg=green"
set -g mode-style "bg=lightgreen,fg=black"
set -g update-environment "WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY"

set -g set-clipboard on

set -g allow-passthrough on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/dots/.config/tmux/plugins/tpm/tpm'
