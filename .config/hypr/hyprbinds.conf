# ╚═╝░░╚═╝░░░╚═╝░░░╚═╝░░░░░╚═╝░░╚═╝╚═════╝░╚═╝╚═╝░░╚══╝╚═════╝░╚═════╝░

#┌────────────────────────────────────────────────────────────────┐
#│                    MODIFIER KEY DEFINITION                      │
#└────────────────────────────────────────────────────────────────┘

$mainMod = SUPER

#┌────────────────────────────────────────────────────────────────┐
#│                    APPLICATION DEFINITIONS                      │
#└────────────────────────────────────────────────────────────────┘

$terminal = ghostty
$editor = nvim
$browser = zen-twilight
$icon-theme = "Neuwaita"
$menu = rofi -show drun -icon-theme $icon-theme -theme $HOME/.config/rofi/launchers/spotlight/spotlight.rasi
# $menu = sherlock
$switcher = rofi -show window -icon-theme "$icon-theme" -theme $HOME/.config/rofi/launchers/spotlight/spotlight.rasi
$search = hyprctl dispatch exec [float] '$terminal --class term-fzf -e fish -c tv'

#┌────────────────────────────────────────────────────────────────┐
#│                    APPLICATION LAUNCHERS                        │
#└────────────────────────────────────────────────────────────────┘

# Terminal
bind = $mainMod, RETURN, exec, [tile] $terminal
# bind = $mainMod SHIFT, RETURN, exec, [float; center] $terminal
bind = $mainMod SHIFT, RETURN, exec, [float; center] ghostty --class=ghostty-float
bind = $mainMod, C, exec, hyprctl dispatch exec [float] "$terminal --class=term-color -e fish -c 'colors'"
bind = $mainMod, M, exec, ~/publicdots/scripts/goplaying-drop.sh
# bind = $mainMod, W, exec, hyprctl dispatch exec "$terminal --class=term-wall -e fish -c 'wallpicker'"
# bind = $mainMod, W, exec, ~/publicdots/scripts/wallselect.sh
# bind = $mainMod SHIFT, W, exec, ~/publicdots/scripts/wal.sh
bind = $mainMod SHIFT, D, exec, ~/publicdots/scripts/wallpaper.sh --dir
bind = $mainMod, W, exec, ~/publicdots/scripts/wallpaper.sh --pick
bind = $mainMod SHIFT, W, exec, ~/publicdots/scripts/wallpaper.sh --random
bind = $mainMod, V, exec, hyprctl dispatch exec "$terminal -e fish -c '$editor'"

# Browsers and file managers
bind = $mainMod, E, exec, nautilus
bind = $mainMod SHIFT, F, exec, $browser

# Launchers and menus
bind = $mainMod, D, exec, $menu
bind = $mainMod, space, exec, $search
# bind = ALT, TAB, exec, $switcher
bind = $mainMod SHIFT, Q, exec, ~/.config/rofi/scripts/powermenu_t4
#bind = $mainMod SHIFT, Q, exec, wlogout

# Utilities and scripts
# bind = $mainMod SHIFT, W, exec, ~/publicdots/scripts/hyprwal.sh
bind = $mainMod, B, exec, killall waybar || waybar
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, I, exec, hyprctl dispatch exec better-control
bind = $mainMod, L, exec, ~/publicdots/scripts/lock.sh
bind = $mainMod, G, exec, ~/publicdots/scripts/gaps.sh
bind = $mainMod SHIFT, L, exec, ~/publicdots/scripts/dark_light_toggle.sh
bind = $mainMod SHIFT, S, exec, ~/publicdots/scripts/grim.sh
bind = $mainMod, S, exec, ~/publicdots/scripts/grimfull.sh
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, grave, exec, hyprctl dispatch hyprexpo:expo toggle
bind = $mainMod, G, exec, ~/publicdots/scripts/hyprland-togglegaps.sh

#┌────────────────────────────────────────────────────────────────┐
#│                    WINDOW MANAGEMENT                           │
#└────────────────────────────────────────────────────────────────┘

# Basic window controls
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, T, togglefloating 
bind = $mainMod, F, fullscreen
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, P, exec, hyprctl dispatch pin
bind = $mainMod, J, togglesplit # dwindle

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Window resizing
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, down, resizeactive, 0 100
bind = $mainMod SHIFT, up, resizeactive, 0 -100

# Layout management
bind = $mainMod CTRL, left, swapsplit
bind = $mainMod CTRL, right, swapsplit
bind = $mainMod CTRL, up, swapsplit
bind = $mainMod CTRL, down, swapsplit

# Preselection
bind = $mainMod CTRL SHIFT, left, layoutmsg, preselect left
bind = $mainMod CTRL SHIFT, right, layoutmsg, preselect right
bind = $mainMod CTRL SHIFT, up, layoutmsg, preselect up
bind = $mainMod CTRL SHIFT, down, layoutmsg, preselect down

#┌────────────────────────────────────────────────────────────────┐
#│                    WORKSPACE MANAGEMENT                         │
#└────────────────────────────────────────────────────────────────┘

# Switch to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, TAB, workspace, e+1

# Special workspace
bind = $mainMod SHIFT, C, movetoworkspace, special
#bind = $mainMod, C, workspace, special
bind = $mainMod, slash, togglespecialworkspace

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Mouse wheel workspace switching
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

#┌────────────────────────────────────────────────────────────────┐
#│                    MEDIA & HARDWARE CONTROLS                   │
#└────────────────────────────────────────────────────────────────┘

# Volume controls
bindel = , XF86AudioRaiseVolume, exec, ~/publicdots/scripts/vol2.sh up
bindel = , XF86AudioMute, exec, ~/publicdots/scripts/vol2.sh toggle
bindel = , XF86AudioLowerVolume, exec, ~/publicdots/scripts/vol2.sh down

# Media controls
bindel = , XF86AudioNext, exec, playerctl next
bindel = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86AudioPlay, exec, playerctl play-pause

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Other hardware keys
bind = , XF86Keyboard, exec, ~/publicdots/scripts/kb_light.sh
bind = , XF86Tools, exec, ~/publicdots/scripts/hyprsunset.sh

#┌────────────────────────────────────────────────────────────────┐
#│                    MOUSE BINDINGS                              │
#└────────────────────────────────────────────────────────────────┘

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#┌────────────────────────────────────────────────────────────────┐
#│                    TMUX NAVIGATION                             │
#└────────────────────────────────────────────────────────────────┘

# Tmux pane navigation
bind = $mainMod ALT, left, exec, tmux select-pane -L

#┌────────────────────────────────────────────────────────────────┐
#│                    PLUGIN BINDINGS                             │
#└────────────────────────────────────────────────────────────────┘
