$mono = Maple Mono
$display = JetBrains Mono Black
$white = rgba(234, 234, 236, 1)

source = $HOME/.cache/wal/colors-hyprland.conf

# background {
#     monitor =
#     path = screenshot
#     blur_passes = 2
# }

# BACKGROUND
background {
  monitor =
  #path = /tmp/cover.jpeg
  #reload_time = 2
  path = $HOME/Pictures/wal.png
  # path = screenshot
  # color = $background
  blur_size = 6
  blur_passes = 3
  contrast = 1
  vibrancy = 0.2
  brightness = 0.6
  vibrancy_darkness = 0.4
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

# GENERAL
general {
  no_fade_in = false
  no_fade_out = false
  hide_cursor = true
  grace = 0
  disable_loading_bar = true
  fractional_scaling = 2
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 64
  outline_thickness = 2
  font_size = 14
  dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(255, 255, 255, 0.2)
  inner_color = rgba(0, 0, 0, 0.2)
  font_color = $white
  fade_on_empty = true
  rounding = 99
  check_color = $color2
  font_family = $mono
  placeholder_text = Enter Password...
  hide_input = false
  position = 0, -110
  halign = center
  valign = center
}

