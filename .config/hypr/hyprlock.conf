# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = $white
  font_size = 120
  # shadow_passes = 3
  # shadow_size = 1
  # shadow_color = rgb(0, 0, 0)
  # shadow_boost = 1
  font_family = Adwaita Sans Black
  position = 0, 60
  halign = center
  valign = center
}

