   monitor =
   text = cmd[update:1000] echo "$($HOME/publicdots/scripts/whatsong.sh)" 
   color = $white
   font_size = 18
   shadow_passes = 3
   shadow_size = 1
   shadow_color = rgb(0, 0, 0)
   shadow_boost = 1
   font_family = $mono, Font Awesome 6 Free Solid
   position = 0, 50
   halign = center
   valign = bottom
 }

