#┌────────────────────────────────────────────────────────────────┐
#│                        CONFIGURATION FILES                     │
#└────────────────────────────────────────────────────────────────┘

source = ~/.cache/wal/colors-hyprland.conf
source = ~/.config/hypr/hyprbinds.conf
source = ~/.config/hypr/hyprplugins.conf
source = ~/.config/hypr/hyprstart.conf

#┌────────────────────────────────────────────────────────────────┐
#│                        MONITOR CONFIGURATION                   │
#└────────────────────────────────────────────────────────────────┘

monitor=,preferred,auto,1

monitor=HEADLESS-2,1920x1080@60,0x0,1

# 1920x1080 for screensharing, recording, etc.
monitor=eDP-1,3024x1890@60,0x0,1.75

monitor=desc:LG Display 0x06B3, 1920x1200@59.95, 0x0, 1
monitor=desc:Dell Inc. Dell AW3420DW, 3440x1440@120, 1920x-600,1
monitor=desc:AU Optronics, 1920x1080@60, 0x0,1
monitor=desc:Philips Consumer Electronics Company, 3840x2160@60, 1920x0,1.5
monitor=desc:GWD ARZOPA, 1920x1080@60, auto-left, 1, transform,1
# monitor=DP-2, 1920x1080@60, 1920x0,1

monitor=DP-2,preferred,auto, 1, mirror, eDP-1
monitor=DP-4,preferred,auto, 2

# Disabled monitors

monitor=Unknown-1,disable
# monitor=desc:Philips Consumer Electronics Company, 3840x2160@60, 0x0,1.5
# monitor=desc:California Institute of Technology 0x1628 0x00006000, 2560x1600@240,0x0,1.333333
# monitor=DP-3, 3440x1440@120,2016x-500,1
#monitor=Virtual-1,3840x2160@60,0x0,1.5
#monitor=HDMI-A-1,1920x1080@60,-1080x520,1,transform,1
#monitor=DP-3, 3840x2160@60,2016x-450,1.5

#┌────────────────────────────────────────────────────────────────┐
#│                     ENVIRONMENT VARIABLES                      │
#└────────────────────────────────────────────────────────────────┘

# NVIDIA related
# env = LIBVA_DRIVER_NAME,iHD
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = WLR_NO_HARDWARE_CURSORS,1

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Session related
env = DESKTOP_SESSION,hyprland
env = XDG_SESSION_TYPE,wayland
env = WAYLAND_DISPLAY,wayland-1

# Theme related
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
# env = GTK_THEME,Adw-gtk3-dark

# Misc settings
ecosystem:no_update_news = true

#┌────────────────────────────────────────────────────────────────┐
#│                      INPUT CONFIGURATION                       │
#└────────────────────────────────────────────────────────────────┘

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    natural_scroll = false
    accel_profile =
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
  

    touchpad {
        natural_scroll = no
        disable_while_typing = true
        scroll_factor = 0.5
        clickfinger_behavior = true
    }
}

device {
    name = ploopy-corporation-ploopy-adept-trackball-mouse
      sensitivity = -1
    name = home-trackpad
      sensitivity = 0.25
  }

#┌────────────────────────────────────────────────────────────────┐
#│                    GENERAL APPEARANCE & BEHAVIOR               │
#└────────────────────────────────────────────────────────────────┘

general {
    gaps_in = 10
    gaps_out = 20
    float_gaps = 50
    border_size = 2
    # col.active_border = 0x20ffffff
    # col.inactive_border = 0x00fffff
    # col.active_border = $foreground 0x00000000 0x00000000 0x00000000
    col.active_border = $color7
    col.inactive_border = $color0
    allow_tearing = false
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
    extend_border_grab_area = 24
    
    gesture = 3, horizontal, workspace
    gesture = 3, swipe, dispatcher, hyprexpo:expo, toggle

    snap {
      enabled = true
      window_gap = 20
      respect_gaps = true
      monitor_gap = 20
    }
}

#┌────────────────────────────────────────────────────────────────┐
#│                     DECORATION & EFFECTS                       │
#└────────────────────────────────────────────────────────────────┘

decoration {
    active_opacity = 1
    inactive_opacity = 1
    rounding = 24
    rounding_power = 3
    
    blur {
        enabled = yes
        size = 12
        passes = 3        # more passes = more resources
        # noise = 0.1
        ignore_opacity = true
        xray = false
        new_optimizations = true
        popups = false
        contrast = 1     # range 0 - 2
        vibrancy = 0.5     # range 0 - 1
        vibrancy_darkness = 0.4 # range 0 - 1
        brightness = 1   # range 0 - 2
    }
    
    dim_strength = 0.2
    dim_around = 0.4
    dim_special = 0.4
    dim_inactive = true
    
    shadow {
        enabled = true
        range = 24
        offset = 0, 0
        # color = 0x80000000
        color = 0x60000000
        color_inactive = 0x20000000
    }
}

#┌────────────────────────────────────────────────────────────────┐
#│                        ANIMATIONS                              │
#└────────────────────────────────────────────────────────────────┘

animations {
    enabled = 1
    
    # Bezier curves
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 0.5
    bezier = overshot, 0.05, 0.9, 0.1, 1.03
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1 
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1
    
    # Animation configurations
    animation = windows, 1, 3, wind, popin
    animation = windowsIn, 1, 3, winIn, popin
    animation = windowsOut, 1, 3, winOut, popin
    animation = windowsMove, 1, 8, wind, popin
    animation = border, 1, 1, smoothOut
    # animation = borderangle, 1, 120, linear, loop 
    animation = fade, 1, 2, smoothOut
    animation = fadeSwitch, 1, 1, quick
    animation = workspaces, 1, 1, almostLinear, slide
    # animation = workspacesIn, 1, 3, winIn, slide
    # animation = workspacesOut, 1, 3, winOut, slide
    animation = layers, 1, 5, overshot 
    animation = layersIn, 1, 5, easeOutQuint, popin 50%
    animation = layersOut, 1, 5, easeOutQuint, slide
}

#┌────────────────────────────────────────────────────────────────┐
#│                     LAYOUT & WINDOW MANAGEMENT                 │
#└────────────────────────────────────────────────────────────────┘

dwindle {
    pseudotile = yes 
    preserve_split = yes
    force_split = 2
    smart_split = false
    default_split_ratio = 1.45
}

# gestures {
#     workspace_swipe = on
#     workspace_swipe_distance = 100
# }

binds {
    movefocus_cycles_fullscreen = false
}

cursor {
    zoom_factor = 1.0  # Setting this to anything higher than 1 will zoom the whole screen
    enable_hyprcursor = true
}

misc {
    font_family = "Maple Mono NF"
    disable_hyprland_logo = true
    allow_session_lock_restore = true
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}

debug {
    disable_logs = false
    #overlay = true
}

