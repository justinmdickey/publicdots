#┌────────────────────────────────────────────────────────────────┐
#│                        LAYER RULES                             │
#└────────────────────────────────────────────────────────────────┘

# ── AGS ─────────────────────────────────────────────────────────
layerrule = match:namespace ags, blur on

# ── Rofi ────────────────────────────────────────────────────────
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0
layerrule = match:namespace rofi, dim_around on
layerrule = match:namespace rofi, animation slide bottom

# ── SwayNC (Notifications) ──────────────────────────────────────
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0

layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0
# layerrule = match:namespace swaync-control-center, dim_around on
layerrule = match:namespace swaync-control-center, animation slidefade right

layerrule = match:namespace swaync, ignore_alpha 0

# ── NWG Tools ───────────────────────────────────────────────────
layerrule = match:namespace nwg-dock, blur on
layerrule = match:namespace nwg-dock, animation slide bottom
layerrule = match:namespace nwg-dock, ignore_alpha 2
