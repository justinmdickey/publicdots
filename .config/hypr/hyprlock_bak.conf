# ═══════════════════════════════════════════════════════════════════════════
# VARIABLES & CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

$mono = Monocraft Nerd Font
$display = Monocraft Nerd Font
$white = rgba(255, 255, 255, 1)
$black = rgba(0, 0, 0, 1)
$fontlarge = 20
$fontmedium = 16

source = $HOME/.cache/wal/colors-hyprland.conf

# ═══════════════════════════════════════════════════════════════════════════
# BACKGROUND & GENERAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════

background {
  monitor =
  color = rgba(0, 0, 0, 1)
  blur_size = 12
  blur_passes = 3
  zindex = -3
  contrast = 1
  vibrancy = 0.2
  brightness = 0.6
  vibrancy_darkness = 0.4
}

general {
  hide_cursor = true
  fractional_scaling = 2
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# BOTTOM STATUS BAR COMPONENTS (LEFT TO RIGHT)
# ═══════════════════════════════════════════════════════════════════════════

# Full-width bottom bar background (zindex: -2)
shape {
  monitor =
  size = 100%, 42
  border_size = 0
  zindex = -2
  color = $color0
  position = 0, 0
  valign = bottom
  halign = center
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# "LOCKED" INDICATOR (FAR LEFT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# "LOCKED" background box
shape {
  monitor =
  size = 140, 42
  border_size = 0
  color = $color4
  position = 0, 0
  valign = bottom
  halign = left
  zindex = 0
}

# "LOCKED" text
label {
  monitor =
  text = LOCKED
  font_size = $fontmedium
  zindex = 1
  text_align = left
  color = $black
  font_family = $mono
  position = 14, 8
  halign = left
  valign = bottom
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# BATTERY INDICATOR (SECOND FROM LEFT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Battery background box
shape {
  monitor =
  size = 100, 42
  border_size = 0
  color = $color3
  position = 140, 0
  valign = bottom
  halign = left
  zindex = 0
}

# Battery percentage text
label {
  monitor =
  text = cmd[update:30000] echo   $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo 100)%
  font_size = $fontmedium
  text_align = left
  color = $black
  font_family = $mono
  zindex = 1
  position = 154, 8
  halign = left
  valign = bottom
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DATE DISPLAY (THIRD FROM LEFT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Date background box
shape {
  monitor =
  size = 150, 42
  border_size = 0
  color = $color5
  position = 240, 0
  valign = bottom
  halign = left
  zindex = 0
}

# Date text
label {
  monitor =
  text = cmd[update:60000] date +"  %b %d"
  font_size = $fontmedium
  zindex = 1
  text_align = left
  color = $black
  font_family = $mono
  position = 254, 8
  halign = left
  valign = bottom
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CPU USAGE (CENTER)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# CPU usage background box
shape {
  monitor =
  size = 160, 42
  border_size = 0
  color = $color6
  position = 0, 0
  valign = bottom
  halign = center
  zindex = 0
}

# CPU usage text
label {
  monitor =
  text = cmd[update:5000] sh -c "echo CPU: $(grep 'cpu ' /proc/stat | awk '{usage=($2+$4)*100/($2+$4+$5)} END {print int(usage)}')%"
  font_size = $fontmedium
  zindex = 1
  text_align = center
  color = $black
  font_family = $mono
  position = 0, 8
  halign = center
  valign = bottom
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# NETWORK STATUS (THIRD FROM RIGHT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

