# UPTIME (SECOND FROM RIGHT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Uptime background box
shape {
  monitor =
  size = 250, 42
  border_size = 0
  color = $color1
  position = -120, 0
  valign = bottom
  halign = right
  zindex = 0
}

# Uptime text
label {
  monitor =
  text = cmd[update:60000] sh -c "uptime -p | sed 's/up /  /' | sed 's/ hours*/h/' | sed 's/ minutes*/m/'"
  font_size = $fontmedium
  zindex = 1
  text_align = right
  color = $black
  font_family = $mono
  position = -134, 8
  halign = right
  valign = bottom
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# TIME DISPLAY (FAR RIGHT)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Time background box
shape {
  monitor =
  size = 120, 42
  border_size = 0
  color = $color2
  position = 0, 0
  valign = bottom
  halign = right
  zindex = 0
}

# Time text
label {
  monitor =
  text = cmd[update:1000] date +%-I:%M
  font_size = $fontmedium
  zindex = 1
  text_align = left
  color = $black
  font_family = $mono
  position = -14, 8
  halign = right
  valign = bottom
}

# ═══════════════════════════════════════════════════════════════════════════
# CENTER LOGIN BOX
# ═══════════════════════════════════════════════════════════════════════════

# Main login box background
shape {
  size = 585, 270
  border_size = 2
  border_color = rgba(255, 255, 255, 1)
  color = rgba(0, 0, 0, 1)
  zindex = 0
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HOSTNAME DISPLAY (TOP OF LOGIN BOX)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Hostname text
label {
  monitor =
  text = cmd[update:5000] $HOME/publicdots/scripts/hostname.sh
  font_size = $fontmedium
  color = $white
  text_align = left
  zindex = 1
  font_family = $mono
  position = 0, 90
  halign = center
  valign = center
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SESSION INFO ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Session label (left side)
label {
  monitor =
  text = session
  font_size = $fontmedium
  text_align = left
  zindex = 1
  color = $white
  font_family = $mono
  position = -200, 0
  halign = center
  valign = center
}

# Hyprland value (right side)
label {
  monitor =
  text = Hyprland
  font_size = $fontmedium
  text_align = left
  zindex = 1
  color = $white
  font_family = $mono
  position = 17, 0
  halign = center
  valign = center
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LOGIN INFO ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Login label (left side)
label {
  monitor =
  text = login
  font_size = $fontmedium
  color = $white
  zindex = 1
  text_align = left
  font_family = $mono
  position = -216, -40
  halign = center
  valign = center
}

# Username value (right side)
label {
  monitor =
  text = $USER
  font_size = $fontmedium
  color = $white
  zindex = 1
  text_align = left
  font_family = $mono
  position = 0, -40
  halign = center
  valign = center
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PASSWORD INPUT ROW
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Password label (left side)
label {
  monitor =
  text = password
  font_size = $fontmedium
  text_align = left
  zindex = 1
  color = $white
  font_family = $mono
  position = -193, -80
  halign = center
  valign = center
}

# Password input field (right side)
input-field {
  monitor =
  size = 250, 40
  outline_thickness = 0
  dots_size = 14
  dots_center = false
  dots_rounding = 8
  dots_spacing = 0.15
  dots_text_format = *
  font_color = $white
  outer_color = rgba(255,255,255,1)
  inner_color = rgba(0, 0, 0, 0.2)
  fade_on_empty = false
  rounding = 0
  check_color = $color2
  zindex = 2
  font_family = $font
  placeholder_text =
  hide_input = false
  position = 83, -95
  halign = center
  valign = center
}
